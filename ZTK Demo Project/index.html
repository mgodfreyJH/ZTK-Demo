  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 27%;
      font-family: sans-serif;
    }

    /* Background on its own fixed compositor layer — never repaints on interaction */
    #bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url('images/JHBackground.png') center center / cover no-repeat;
      will-change: transform;
    }

    /* ── Phone frame ── */
    .phone-frame {
      position: relative;
      width: 290px;
      height: 684px;
      background: #1c1c1e;
      border-radius: 44px;
      box-shadow: 0 0 0 2px #3a3a3c, 0 20px 60px rgba(0, 0, 0, 0.6);
      will-change: transform; /* own GPU layer — isolates from background */
    }

    .phone-notch {
      position: relative;
      width: 100px;
      height: 24px;
      background: #1c1c1e;
      border-radius: 0 0 16px 16px;
      margin: 0 auto;
      z-index: 2;
    }

    .home-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 4px;
      background: #3a3a3c;
      border-radius: 2px;
    }

    /* ── Phone screen (carousel viewport) ── */
    .phone-screen {
      position: absolute;
      inset: 48px 12px 60px 12px;
      overflow: hidden;
      background: transparent;
      border-radius: 4px;
    }

    /* ── Carousel slides ── */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 300ms ease-in-out;
      border: none;
      outline: none;
      box-shadow: none;
    }

    /* ── Click zone (right 50% of screen) ── */
    .click-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      cursor: pointer;
      z-index: 10;
    }

    /* ── Left zone ── */
    .left-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      cursor: pointer;
      z-index: 10;
    }

    /* ── GET STARTED CTA hotspot (active on all carousel screens) ── */
    #cta-hotspot {
      position: absolute;
      top: 87.1%;
      left: 19.2%;
      width: 62.3%;
      height: 5%;
      z-index: 11;
      pointer-events: none;
      cursor: pointer;
      border: none;
      outline: none;
    }

    /* ── Kill 300ms tap delay on all interactive zones ── */
    #click-zone, #left-zone, #cta-hotspot, #accept-hotspot, #smb-cta-hotspot, #smb-accept-hotspot {
      touch-action: manipulation;
    }

    /* ── Accept & Continue hotspot (active only on T&C screen) ── */
    /* Button measured at y=1672–1766 in 1792px image; aspect ratios match → no letterboxing */

      position: absolute;
      top: 93.4%;
      left: 3.3%;
      width: 93.9%;
      height: 5.3%;
      z-index: 12;
      pointer-events: none;
      cursor: pointer;

    function advance() {
      if (isAnimating || flowState !== 'carousel') return;
      isAnimating = true;

      const activeImages = getActiveCarouselImages();
      const nextIndex = (currentCarouselIndex + 1) % activeImages.length;

      // Stage incoming image off-screen right with no transition
      incoming.style.transition = 'none';
      incoming.src = activeImages[nextIndex];
      incoming.style.transform = 'translateX(100%)';

      // Double rAF ensures the browser registers the reset before animating
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          current.style.transition  = 'transform 300ms ease-in-out';
          incoming.style.transition = 'transform 300ms ease-in-out';
          current.style.transform   = 'translateX(-100%)';
          incoming.style.transform  = 'translateX(0)';

          setTimeout(() => {
            current.style.transition  = 'none';
            current.src               = activeImages[nextIndex];
            current.style.transform   = 'translateX(0)';
            incoming.style.transition = 'none';
            incoming.style.transform  = 'translateX(100%)';
            currentCarouselIndex = nextIndex;
            isAnimating  = false;
            if (activeUseCase === 'enroll-smb') {
              smbCtaHotspot.style.pointerEvents = 'all';
            } else {
              ctaHotspot.style.pointerEvents = 'all';
            }
          }, 300);
        });
      });
    }

    function retreat() {
      if (isAnimating || flowState !== 'carousel') return;
      isAnimating = true;

      const activeImages = getActiveCarouselImages();
      const prevIndex = (currentCarouselIndex - 1 + activeImages.length) % activeImages.length;

      // Stage incoming image off-screen left with no transition
      incoming.style.transition = 'none';
      incoming.src              = activeImages[prevIndex];
      incoming.style.transform  = 'translateX(-100%)';

      // Double rAF ensures the browser registers the reset before animating

          current.style.transform   = 'translateX(100%)';

            incoming.style.transition = 'none';
            incoming.style.transform  = 'translateX(-100%)';

      disableAllPhoneHotspots();

      current.style.transition = 'opacity 300ms ease-in';
      current.style.opacity = '0.5';

      const phoneScreen = document.querySelector('.phone-screen');
      const spinner = document.createElement('div');
      spinner.id = 'spinner';
      phoneScreen.appendChild(spinner);

      spinnerTimerId = setTimeout(() => {
        spinner.remove();
        current.style.transition = 'none';
        current.style.opacity = '1';
        current.src = PREFS_MANAGE_PROFILES_IMAGE;
        flowState = 'prefs-manage-profiles';
        isAnimating = false;
        prefsMgProfileRowHotspot.style.pointerEvents = 'all';
        prefsBackHotspot.style.pointerEvents = 'all';
      }, 1000);
    }

    function prefsToProfileDetails() {
      if (isAnimating || flowState !== 'prefs-manage-profiles') return;
      disableAllPhoneHotspots();
      setScreenInstant(PREFS_PROFILE_DETAILS_IMAGE, 'prefs-profile-details');
      prefsAccountRowHotspot.style.pointerEvents = 'all';
      prefsBackHotspot.style.pointerEvents = 'all';
    }

    function prefsToSelectAccount() {
      if (isAnimating || flowState !== 'prefs-profile-details') return;
      disableAllPhoneHotspots();
      setScreenInstant(PREFS_SELECT_ACCOUNT_IMAGE, 'prefs-select-account');
      prefsSelectAccountBackHotspot.style.pointerEvents = 'all';
    }

    function prefsBack() {
      if (isAnimating) return;
      if (flowState === 'prefs') {
        disableAllPhoneHotspots();
        setScreenInstant(PREFS_LANDING_IMAGE, 'prefs-landing');
        prefsLandingIconHotspot.style.pointerEvents = 'all';
      } else if (flowState === 'prefs-manage-profiles') {
        disableAllPhoneHotspots();
        setScreenInstant(PREFS_IMAGE, 'prefs');
        prefsManageProfilesRowHotspot.style.pointerEvents = 'all';
        prefsBackHotspot.style.pointerEvents = 'all';
      } else if (flowState === 'prefs-profile-details') {
        disableAllPhoneHotspots();
        setScreenInstant(PREFS_MANAGE_PROFILES_IMAGE, 'prefs-manage-profiles');
        prefsMgProfileRowHotspot.style.pointerEvents = 'all';
        prefsBackHotspot.style.pointerEvents = 'all';
      }
    }

    function prefsSelectAccountBack() {
      if (isAnimating || flowState !== 'prefs-select-account') return;
      disableAllPhoneHotspots();
      setScreenInstant(PREFS_PROFILE_DETAILS_IMAGE, 'prefs-profile-details');
      prefsAccountRowHotspot.style.pointerEvents = 'all';
      prefsBackHotspot.style.pointerEvents = 'all';
    }

    // ── Event listeners ──
    clickZone.addEventListener('pointerdown', advance);
    leftZone.addEventListener('pointerdown', retreat);
    ctaHotspot.addEventListener('pointerdown', showTerms);
    smbCtaHotspot.addEventListener('pointerdown', showTerms);
    acceptHotspot.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      showChooseScreen();
    });
    smbAcceptHotspot.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      showSmbChooseScreen();
    });
    chooseRadioHotspot.addEventListener('pointerdown', swapToChooseReceive02);
    chooseContinueHotspot.addEventListener('pointerdown', p2pToAuthOtp01);
    smbAuthOtp01ContinueHotspot.addEventListener('pointerdown', p2pToAuthOtp02);
    smbAuthOtp02ContinueHotspot.addEventListener('pointerdown', p2pProcessToSelectAccount01);
    selectRadioHotspot.addEventListener('pointerdown', swapToSelectAccount02);
    selectContinueHotspot.addEventListener('pointerdown', showProcessing);
    congratsCTAHotspot.addEventListener('pointerdown', toZrcIntro);
    zrcAccessHotspot.addEventListener('pointerdown', fromZrcIntro);
    allowContacts01Hotspot.addEventListener('pointerdown', toAllowContacts02);
    allowContacts02Hotspot.addEventListener('pointerdown', toHowShare);
    howShareHotspot.addEventListener('pointerdown', toSelectContinue);
    selectContinue06Hotspot.addEventListener('pointerdown', toAllow15);
    allow15Hotspot.addEventListener('pointerdown', toLandingPage);

    smbChooseRadioHotspot.addEventListener('pointerdown', smbSwapToChooseReceive02);
    smbChooseContinueHotspot.addEventListener('pointerdown', smbToAuth03);
    smbAuth03RadioHotspot.addEventListener('pointerdown', smbSwapToAuth04);
    smbAuth04ContinueHotspot.addEventListener('pointerdown', smbToAuthOtp01);
    smbAuthOtp01ContinueHotspot.addEventListener('pointerdown', smbToAuthOtp02);
    smbAuthOtp02ContinueHotspot.addEventListener('pointerdown', smbProcessToCreateTag01);
    smbCreateTag01ContinueHotspot.addEventListener('pointerdown', smbToCreateTag02);
    smbCreateTag02ContinueHotspot.addEventListener('pointerdown', smbToCreateTag03);
    smbCreateTag03CTAHotspot.addEventListener('pointerdown', smbToCreateTag04);
    smbCreateTag04ContinueHotspot.addEventListener('pointerdown', smbToCreateTag05);
    smbCreateTag05FinishHotspot.addEventListener('pointerdown', smbToSelectPrimary01);
    smbSelectPrimaryRadioHotspot.addEventListener('pointerdown', smbToSelectPrimary02);
    smbSelectPrimaryContinueHotspot.addEventListener('pointerdown', smbToCongrats);
    smbCongratsCTAHotspot.addEventListener('pointerdown', smbToZrcIntro);
    smbZelleTagIntroCTAHotspot.addEventListener('pointerdown', smbToContactsFlow);

    spSendHotspot.addEventListener('pointerdown', spToScam01);
    spScamCheckboxHotspot.addEventListener('pointerdown', spToScam02);
    spScamGotItHotspot.addEventListener('pointerdown', spToRecipient01);
    spRecipientNameHotspot.addEventListener('pointerdown', spToRecipient02);
    spRecipientNextHotspot.addEventListener('pointerdown', spToRecipient03);
    spRecipientZelleTagHotspot.addEventListener('pointerdown', spToRecipient04);
    spRecipientAddContinueHotspot.addEventListener('pointerdown', spToRecipientSure);
    spRecipientYesHotspot.addEventListener('pointerdown', spProcessToAmount01);
    spAmountAreaHotspot.addEventListener('pointerdown', spToAmount02);
    spAmountReviewHotspot.addEventListener('pointerdown', spProcessToReviewSend);
    spReviewSendHotspot.addEventListener('pointerdown', spToOtp01);
    spOtpAreaHotspot.addEventListener('pointerdown', spToOtp02);
    spOtpVerifyHotspot.addEventListener('pointerdown', spToKeepSafe);
    spKeepsafeSendHotspot.addEventListener('pointerdown', spProcessToPaymentSent);
    spAllDoneHotspot.addEventListener('pointerdown', spToLandingPageEnd);

    actLandingActivityHotspot.addEventListener('pointerdown', actToListViewPayment);
    actPaymentBackHotspot.addEventListener('pointerdown', actPaymentBackToLanding);
    actPaymentRequestToggleHotspot.addEventListener('pointerdown', actPaymentToggleToRequest);
    actRowBourbonHotspot.addEventListener('pointerdown', actToBourbonDetail);
    actRowKerryKingHotspot.addEventListener('pointerdown', actToKerryKingPaymentDetail);
    actRowCigarPlaceHotspot.addEventListener('pointerdown', actToCigarPlaceDetail);
    actRowDogWalkHotspot.addEventListener('pointerdown', actToDogWalkDetail);
    actRowMetalManHotspot.addEventListener('pointerdown', actToMetalManDetail);
    actRequestBackHotspot.addEventListener('pointerdown', actRequestBackToLanding);
    actRequestPaymentToggleHotspot.addEventListener('pointerdown', actRequestToggleToPayment);
    actRowDimmuBorgerRequestHotspot.addEventListener('pointerdown', actToDimmuBorgerRequestDetail);
    actRowKerryKingRequest1Hotspot.addEventListener('pointerdown', actToKerryKingDeniedDetail);
    actRowKerryKingRequest2Hotspot.addEventListener('pointerdown', actToKerryKingDeniedDetail);
    actDetailBackHotspot.addEventListener('pointerdown', actDetailBackToListView);

    mrLandingIconHotspot.addEventListener('pointerdown', mrLandingToList);
    mrListBackHotspot.addEventListener('pointerdown', mrListBackToLanding);
    mrRowBourbonHotspot.addEventListener('pointerdown', mrToBourbonDetail);
    mrRowCigarPlaceHotspot.addEventListener('pointerdown', mrToCigarPlaceDetail);
    mrRowDogWalkHotspot.addEventListener('pointerdown', mrToDogWalkDetail);
    mrRowMetalManHotspot.addEventListener('pointerdown', mrToMetalManDetail);
    mrDetailBackHotspot.addEventListener('pointerdown', mrDetailBackToList);

    prefsLandingIconHotspot.addEventListener('pointerdown', prefsLandingToPreferences);
    prefsManageProfilesRowHotspot.addEventListener('pointerdown', prefsProcessToManageProfiles);
    prefsMgProfileRowHotspot.addEventListener('pointerdown', prefsToProfileDetails);
    prefsAccountRowHotspot.addEventListener('pointerdown', prefsToSelectAccount);
    prefsBackHotspot.addEventListener('pointerdown', prefsBack);
    prefsSelectAccountBackHotspot.addEventListener('pointerdown', prefsSelectAccountBack);

    // ── Radio use-case selection ──
    document.querySelectorAll('input[name="use-case"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        activeUseCase = e.target.value;
        if (e.target.value === 'enroll-smb') {
          activateEnrollSMB();
        } else if (e.target.value === 'send-payment') {
          activateSendPayment();
        } else if (e.target.value === 'activity') {
          activateActivity();
        } else if (e.target.value === 'manage-recipients') {
          activateManageRecipients();
        } else if (e.target.value === 'preferences') {
          activatePreferences();
        } else {
          activateEnrollP2P();
        }
      });
    });

    // Initialize: lock screen state, all zones disabled
    resetToLockScreen();
  </script>
</body>
</html>
